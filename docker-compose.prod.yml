# FlashFire JR scraper — production cluster for the 8 GB / 4-core box.
#
# Hand-maintained (NOT generated by cluster.sh) and right-sized for this host:
#   • 2 scraper replicas → redundancy + failover (one crashes, nginx routes to
#     the other; restart:always brings it back). 6 concurrent scrapes box-wide
#     (JDFETCH_MAX_CONCURRENT=3 each) vs the old single-node 2.
#   • nginx `lb` fronts them on 127.0.0.1:8092 (localhost only — the scraper API
#     is UNAUTHENTICATED, so it must not be internet-exposed. At cutover, change
#     the published address to the dashboard's IP and firewall it, see DEPLOY).
#   • Per-replica caps sized for 7.8 GB: mem 2560M + shm 512M each.
#
# Deploy:  docker compose -f docker-compose.prod.yml up -d --build
# Logs:    docker compose -f docker-compose.prod.yml logs -f
# Status:  docker compose -f docker-compose.prod.yml ps

x-scraper-common: &scraper-common
  image: flashfire-scraper:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: always
  stop_grace_period: 30s
  shm_size: 512m
  mem_limit: 2560m
  security_opt:
    - seccomp:unconfined
  env_file:
    - .env
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8092/api/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 40s
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  # autoheal (below) restarts any container that goes unhealthy — covers the
  # hung-but-not-crashed case that restart:always alone misses.
  labels:
    - autoheal=true

x-scraper-env: &scraper-env
  NODE_ENV: "production"   # pinned — don't inherit the dev .env's NODE_ENV
  PORT: "8092"
  STORAGE_DIR: /app/storage
  RUNS_DIR: /app/runs
  AI_CACHE_DIR: /app/ai-cache
  JDFETCH_CACHE_DIR: /app/jd-cache
  HEADLESS: "true"
  # jdFetch tuning for this box (per replica). 3 concurrent Chromium scrape
  # pages × 2 replicas = 6 box-wide; 35s nav lets slow ATS (Workday/iCIMS)
  # finish instead of timing out as "couldn't open the job posting".
  JDFETCH_MAX_CONCURRENT: "3"
  JDFETCH_NAV_TIMEOUT_MS: "35000"

services:
  scraper-1:
    <<: *scraper-common
    container_name: flashfire-prod-scraper-1
    expose:
      - "8092"
    environment:
      <<: *scraper-env
      REPLICA_ID: "1"
    volumes:
      - ./cluster/storage-1:/app/storage   # isolated Chromium profile (singleton per userDataDir)
      - ./runs:/app/runs                    # shared run artifacts
      - ./ai-cache:/app/ai-cache            # shared OpenAI response cache
      - ./jd-cache:/app/jd-cache            # shared jd-fetch cache

  scraper-2:
    <<: *scraper-common
    container_name: flashfire-prod-scraper-2
    expose:
      - "8092"
    environment:
      <<: *scraper-env
      REPLICA_ID: "2"
    volumes:
      - ./cluster/storage-2:/app/storage
      - ./runs:/app/runs
      - ./ai-cache:/app/ai-cache
      - ./jd-cache:/app/jd-cache

  lb:
    image: nginx:1.27-alpine
    container_name: flashfire-prod-lb
    # PUBLIC publish on 0.0.0.0:8092 (explicit operator choice). NOTE: the
    # scraper API is UNAUTHENTICATED and there is no host firewall, so this is
    # reachable by anyone on the internet. Lock down later via a DOCKER-USER
    # iptables allowlist or an nginx token gate if abuse appears.
    ports:
      - "8092:80"
    volumes:
      - ./cluster/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      scraper-1:
        condition: service_healthy
      scraper-2:
        condition: service_healthy
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      # 127.0.0.1, NOT localhost — nginx listens IPv4-only, but localhost can
      # resolve to ::1 (IPv6) in the container → "connection refused" → the LB
      # would flap unhealthy and autoheal would restart it in a loop.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/lb-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # Watchdog: restarts any container labelled autoheal=true that Docker marks
  # unhealthy (healthcheck failing). restart:always handles crashes/reboots;
  # this handles a process that's alive but wedged. Read-only docker.sock.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: flashfire-prod-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15          # check every 15s
      - AUTOHEAL_START_PERIOD=60      # give a fresh container 60s before judging
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  default:
    name: flashfire-prod-network

# FlashFire scraper LB — path-split load balancing (hand-maintained for prod).
#
# Two upstreams over the same replicas, chosen per route:
#   • scrape_pool (least_conn) — STATELESS endpoints (/extract, /api/fetch-jd,
#     /api/health). These are pure "URL in → text out"; spreading them across
#     replicas is the actual load balancing (the second-stage screener hits
#     these from ONE backend IP, so ip_hash would pin it all to one replica).
#   • runs_pool (ip_hash) — STATEFUL endpoints (/api/runs + SSE). Run state is
#     in-memory per replica, so a client must stick to the replica that owns
#     its run, or status/SSE polls hit a replica that never heard of the run.

worker_processes auto;
events { worker_connections 4096; }

http {
    access_log off;

    # Docker's embedded DNS. `resolve` on the upstream servers below makes nginx
    # resolve replica names at RUNTIME (re-checked every 10s) instead of once at
    # startup — so a replica being temporarily down/missing no longer makes nginx
    # refuse to start ("[emerg] host not found in upstream"). Critical for the LB
    # to survive a crashed/restarting replica. `zone` is required by `resolve`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream scrape_pool {
        zone scrape_pool 64k;
        least_conn;
        server scraper-1:8092 resolve max_fails=3 fail_timeout=15s;
        server scraper-2:8092 resolve max_fails=3 fail_timeout=15s;
        keepalive 64;
    }

    upstream runs_pool {
        zone runs_pool 64k;
        ip_hash;
        server scraper-1:8092 resolve max_fails=3 fail_timeout=15s;
        server scraper-2:8092 resolve max_fails=3 fail_timeout=15s;
    }

    # Common proxy settings (inherited by every location below).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    server {
        listen 80;
        client_max_body_size 25m;

        # LB-level liveness — 200 without touching a replica.
        location = /lb-health { return 200 "lb ok\n"; }

        # ---- Stateless scrape endpoints → balanced (least_conn) -------------
        # Scrapes can take up to ~35s nav + settle; allow generous read timeout.
        location /extract/ {
            proxy_pass http://scrape_pool;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
        location /api/extract/ {
            proxy_pass http://scrape_pool;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
        location /api/fetch-jd {
            proxy_pass http://scrape_pool;
            proxy_read_timeout 180s;   # /fetch-jd/batch fans out many URLs
            proxy_send_timeout 180s;
        }
        location = /api/health {
            proxy_pass http://scrape_pool;
        }

        # ---- Everything else (JR runs + SSE) → sticky (ip_hash) -------------
        location / {
            proxy_pass http://runs_pool;
            # SSE (/api/runs/:id/events) must stream live — no buffering.
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
